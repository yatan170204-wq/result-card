<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Password Strength</title>
<style>
  body { font-family: Arial, sans-serif; display: flex; justify-content: center; margin: 40px; }
  .box { width: 340px; }
  h2 { text-align: center; }
  input[type="password"], input[type="text"] { width: 100%; padding: 8px; font-size: 15px; box-sizing: border-box; }
  .show { margin: 8px 0; font-size: 14px; }
  .bar-bg { height: 8px; background: #ddd; border-radius: 4px; overflow: hidden; }
  #bar { height: 100%; width: 0; background: #ddd; transition: width 0.3s, background 0.3s; }
  #label { font-weight: bold; margin: 6px 0 12px; min-height: 20px; }
  ul { list-style: none; padding: 0; margin: 0; }
  li { color: #888; margin: 5px 0; font-size: 14px; }
  li.ok { color: #2e7d32; }
</style>
</head>
<body>

<div class="box">
  <h2>Password Strength</h2>
  <input type="password" id="pwd" placeholder="Enter password">
  <div class="show">
    <input type="checkbox" id="toggle">
    <label for="toggle">Show password</label>
  </div>
  <div class="bar-bg"><div id="bar"></div></div>
  <div id="label"></div>
  <ul id="rules"></ul>
</div>

<script>
  const rules = [
    { text: "At least 8 characters", test: p => p.length >= 8 },
    { text: "One uppercase letter", test: p => /[A-Z]/.test(p) },
    { text: "One lowercase letter", test: p => /[a-z]/.test(p) },
    { text: "One number", test: p => /[0-9]/.test(p) },
    { text: "One special symbol (!@#$%^&*)", test: p => /[^A-Za-z0-9]/.test(p) }
  ];

  const pwd = document.getElementById("pwd");
  const toggle = document.getElementById("toggle");
  const bar = document.getElementById("bar");
  const label = document.getElementById("label");
  const list = document.getElementById("rules");

  rules.forEach(r => {
    const li = document.createElement("li");
    li.textContent = "• " + r.text;
    r.el = li;
    list.appendChild(li);
  });

  pwd.addEventListener("input", () => {
    const value = pwd.value;
    let passed = 0;

    rules.forEach(r => {
      if (r.test(value)) {
        passed++;
        r.el.classList.add("ok");
        r.el.textContent = "✔ " + r.text;
      } else {
        r.el.classList.remove("ok");
        r.el.textContent = "• " + r.text;
      }
    });

    if (value === "") {
      bar.style.width = "0";
      label.textContent = "";
      return;
    }

    bar.style.width = (passed / rules.length) * 100 + "%";

    if (passed <= 2) {
      bar.style.background = "red";
      label.textContent = "Weak";
      label.style.color = "red";
    } else if (passed <= 4) {
      bar.style.background = "orange";
      label.textContent = "Medium";
      label.style.color = "orange";
    } else {
      bar.style.background = "green";
      label.textContent = "Strong";
      label.style.color = "green";
    }
  });

  toggle.addEventListener("change", () => {
    pwd.type = toggle.checked ? "text" : "password";
  });
</script>

</body>
</html>
